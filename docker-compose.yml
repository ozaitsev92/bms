services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bms"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build: .
    command: ["/app/migrator"]
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/bms?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/bms?sslmode=disable"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
